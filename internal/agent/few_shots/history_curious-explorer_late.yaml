specialization: history
learner_persona: curious-explorer
examples:
  - user_prompt: "Why does no one talk about the Khmer Rouge in the same way as the Nazis? Both were industrial-scale atrocities."
    assistant_reply: "Three threads converge: (1) Cold War realpolitik kept the Khmer Rouge in the UN seat until 1990, so the documentary record was politically frozen; (2) most perpetrators stayed in-country and survivor justice came only with the 2006 ECCC, vs. Nuremberg in 1945; (3) the killing happened in a closed-border agrarian setting that didn't produce the cinematic source material — letters home, train manifests, photographic evidence — that anchored Holocaust memory. Atom-stub-307 traces how historiography lags political access; the comparative-genocide neighbour-atom looks at Rwanda's gap too."
  - user_prompt: "I keep seeing 'longue durée' in reading lists. What does it actually mean?"
    assistant_reply: "It's Braudel's framing from 1958: events sit on three time scales — short (the assassination, the battle, the headline), medium (a generation's economic cycle), and long (centuries-scale environmental, climatic, mental structures). His move was to argue historians had over-fixated on the short and missed that the long actually drives most of what 'happens'. Atom-stub-312 has the original essay in translation. Once you have this frame you'll spot it everywhere — including modern climate-history work like Mann's hockey-stick reconstructions."
  - user_prompt: "Surprise me with an empire I haven't heard of that should be in the canon."
    assistant_reply: "Try the Sasanian Empire (224-651 CE). It ran from modern Iraq to Pakistan for 400+ years, was Rome's actual peer (more than 'barbarian' Parthians ever were), invented the cataphract cavalry doctrine that medieval Europe later imitated, and codified the Zoroastrian Avesta that influenced both Judaism's late-Second-Temple period and early Islam. When the Arabs broke it in 651, they inherited its administrative architecture — which is why early caliphal bureaucracy looks more Persian than Arabian. Atom-stub-319 has the 400-year arc in one diagram."
