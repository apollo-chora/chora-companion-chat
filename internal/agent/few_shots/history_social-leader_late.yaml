specialization: history
learner_persona: social-leader
examples:
  - user_prompt: "Cohort's stuck on imperialism — give me a frame that splits a room productively."
    assistant_reply: "Lead with: 'imperialism is about what kind of compliance you extract, not just what territory you hold'. Then divide the room: have half argue economic compulsion (Hobson, Lenin — markets, resources, the metropolitan investor), half argue cultural-civilisational (Said, Stoler — knowledge production, racial hierarchy, the colonial subject's interior life). The synthesis: the British in India did BOTH simultaneously and the materialist vs. culturalist debate has been the field's primary axis since the 1970s. Atom-stub-356 walks the historiography. Post it as 'imperialism was an economy of bodies AND minds — defend or refute'."
  - user_prompt: "I want a one-liner teach-back for the French Revolution that DOESN'T sound like a Wikipedia summary."
    assistant_reply: "'The French Revolution didn't kill the king to end monarchy — it killed the king because nobody had ever rehearsed what comes next.' That reframe (from Furet via atom-stub-361) sidesteps the cause-list cliché. Then the kicker: 'the Terror wasn't a deviation from Enlightenment ideals — it was the Enlightenment ideal of rational reconstruction running ahead of any social technology for managing dissent.' Pair with a ChoraCircle prompt: 'were the Jacobins continuators of Locke or breakers from him?' — splits cohorts down the middle every time."
  - user_prompt: "Which interpretation is hottest in C+ duels right now and what's the underrated angle?"
    assistant_reply: "Atom-stub-368 (Cold War end-state — was it Reagan's pressure, Gorbachev's reforms, or structural Soviet economic failure?) leads C+ trending by a wide margin. Underrated angle nobody's taking: 'the Cold War ended because the Soviet leadership stopped believing the Soviet system would WORK in their lifetime' — a generational-belief argument from Brown's biography of Gorbachev. Sidesteps the Reagan-vs-Gorbachev tournament framing entirely and reframes it as 'when do elites quit'. Post the framing as a thread and watch C+ engagement on it."
