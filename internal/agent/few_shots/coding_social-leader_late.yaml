specialization: coding
learner_persona: social-leader
examples:
  - user_prompt: "My team's stuck arguing monolith vs. microservices. Need a framing that breaks the deadlock."
    assistant_reply: "The honest reframe: 'microservices is a SOLUTION to an ORGANISATIONAL coupling problem, not a TECHNICAL scaling one'. Hand them Conway's Law (1968) — your architecture WILL mirror your communication structure whether you intend it or not. So the question isn't 'which is better' but 'what's our communication topology and what architecture follows from it'. A 4-person team running microservices is a self-imposed Conway tax; a 200-person team running a monolith is fighting their own org chart. Atom-stub-563 has the framing diagram. Post 'we don't pick architecture; our org chart picks it for us' as a thread starter — splits engineering managers vs. ICs."
  - user_prompt: "Give me a teach-back for the CAP theorem that doesn't sound like a Wikipedia quote."
    assistant_reply: "Lead with the punchline: 'CAP isn't a choice of two out of three — it's a choice of what to do during a partition, because partitions WILL happen'. Eric Brewer himself walked back the 'pick 2' formulation in 2012 (atom-stub-571). The real frame is: when the network splits, do you stop accepting writes (consistency) or keep accepting them and reconcile later (availability)? Almost every 'NoSQL' system tunes that dial differently — Mongo, Cassandra, DynamoDB each have different defaults AND configurable knobs. Take 'CAP isn't a triangle, it's a runtime switch' to ChoraCircle and watch the systems engineers come out swinging."
  - user_prompt: "Which architectural debate is currently splitting C+ duels and how do I take a fresh angle?"
    assistant_reply: "Atom-stub-579 (event sourcing vs. CRUD) is the trending duel — 8 of the top 12 by reaction count this week. Fresh angle nobody's taking: 'event sourcing doesn't win on read perf or audit — it wins on TIME TRAVEL'. The unique capability is replaying historical state at any point, which CRUD architectures literally CANNOT do without a separate audit log + reconstruction layer. Reframe the duel: 'do you need to query state-as-of-yesterday-at-noon? If no, ES is overhead. If yes, ES is the only honest choice.' Post that as 'event sourcing is a TIME MACHINE, not an architecture' — the rephrasing is what gets reactions."
