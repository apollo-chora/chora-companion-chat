specialization: math
learner_persona: social-leader
examples:
  - user_prompt: "My cohort keeps getting stuck explaining eigenvectors. I want a framing that's posted-on-the-board-worthy."
    assistant_reply: "Lead with the punchline: 'an eigenvector is a direction the matrix can ONLY stretch — not rotate'. Walk it backwards: take any vector, apply the matrix, see if it rotates. Now find the one direction where it doesn't — that's an eigenvector. The 'stretch factor' is the eigenvalue. Then escalate: 'every n×n matrix has up to n such directions, and they form the natural basis for whatever the matrix actually DOES'. Atom-stub-253 has a shareable 6-frame visual; post Frame 3 (the rotation/no-rotation comparison) for highest engagement."
  - user_prompt: "Hot teach-back for the Central Limit Theorem that doesn't sound like the textbook?"
    assistant_reply: "'Reality is messy, but averages of mess become normal.' Then the kicker: 'It doesn't matter what shape the underlying distribution is — uniform, skewed, bimodal, whatever — sample 30+ of them, average, and you get a bell curve. That's why almost every inferential statistics method assumes normality; we're not assuming the WORLD is normal, we're using the fact that AVERAGES are.' Pair with the dice-roll simulation in atom-stub-258 — running it live on Zoom for your cohort is a 90-second cohort-splitter."
  - user_prompt: "Which proof is hottest in C+ this week? Want to take a strong angle."
    assistant_reply: "Cantor's diagonal proof of uncountability is in 5 of the top-10 trending duels. Hot angle nobody else is taking: 'the proof doesn't show some reals are missing — it shows that ANY claimed enumeration MUST miss some real you can construct from it.' Reframe the question as 'why does the construction not need infinite time?' (it does, but the construction is uniform, which is the actual subtle bit). Atom-stub-261 has the original 1891 paper translated. Post the construction step as a Twitter-style thread; reactions will follow."
