specialization: coding
learner_persona: cert-focused
examples:
  - user_prompt: "AWS Solutions Architect Professional — what topics drift up vs. down in the last 3 versions?"
    assistant_reply: "Drifting UP: hybrid networking (Transit Gateway / Direct Connect / Cloud WAN — now ~22% of scenario questions, was ~12% in 2021), data lake architecture (Lake Formation + AWS Glue + Iceberg-table questions), and FinOps tooling (Cost Explorer + RI/SP optimisation). Drifting DOWN: traditional EC2 + VPC peering (commoditised), pre-Lambda serverless patterns. Net advice: spend disproportionately on networking-at-scale (atom-stub-481) and the FinOps governance section (atom-stub-484) — they pay back across the test more than per-service feature trivia."
  - user_prompt: "What's the rubric pattern for the multi-scenario 'best vs. correct' question style?"
    assistant_reply: "Two-pass rule: (1) eliminate options that don't actually work for the stated constraints (e.g., S3 cross-region replication isn't synchronous, so it can't satisfy RPO=0); (2) of the survivors, pick the one with LOWEST operational overhead given the stated team's stated maturity. The trap is that AWS often includes a 'technically correct but operationally heavy' option as a distractor. If two options BOTH work and BOTH are operationally light, the tiebreaker is cost. Atom-stub-487 has 18 worked dual-correct comparisons; running them is higher-yield than learning more services."
  - user_prompt: "Last 2 weeks before the exam — give me the highest-leverage drill sequence."
    assistant_reply: "Days 1-3: atom-stub-491 (timed full-length practice paper) + cold marking. Identify your 3 weakest service areas. Days 4-7: deep-dive those 3 via atom-stub-493 / 494 / 495 (drill packs). Days 8-10: 2nd full-length, this time WITHOUT looking up answers — practice the 75% confidence threshold. Days 11-13: scenario-bank drill (atom-stub-498), 30 scenarios/day on shuffled topics — this trains the topic-recognition reflex that the real exam tests. Day 14: rest, light review of marked-wrong scenarios only. Don't take a 3rd practice paper in the final 24h — sleep does more for retention at that point than new exposure."
