specialization: history
learner_persona: cert-focused
examples:
  - user_prompt: "A-Level H2 History — what's the source-based question marker actually looking for at L5?"
    assistant_reply: "L5 (highest band) requires four things in combination: (1) provenance evaluated explicitly — author / date / audience / purpose, not just identified, (2) cross-referencing AT LEAST two sources against each other with a clear comparative claim, (3) historiographical context cited (one named scholar or school is enough — Hobsbawm, Mazower, Kershaw, etc.), (4) a judgement that addresses the question's specific wording, not a generic 'thus we can conclude'. Drop the cross-reference and you cap at L4; drop the judgement and you cap at L3 regardless of the source work. Atom-stub-329 has 6 L5 exemplar essays annotated."
  - user_prompt: "Build me the optimum reading list for the Cold War unit — I have 4 weeks."
    assistant_reply: "Week 1: foundation — Gaddis 'We Now Know' (post-archive synthesis) + atom-stub-336 (per-year timeline summary). Week 2: revisionism — Leffler 'Preponderance of Power' for the US side, Zubok 'Failed Empire' for the Soviet. Week 3: Asian theatre — Cumings on Korea, atom-stub-341 on the Sino-Soviet split. Week 4: historiography overview — Westad 'The Global Cold War' to scaffold a 12-mark interpretation question. Skip Fukuyama unless you have time — it's discussed in atom-stub-343 with the critiques, which is the version examiners actually want cited."
  - user_prompt: "What's the rubric-killer mistake on a 25-mark interpretation question?"
    assistant_reply: "Listing historians without engaging their argument. 'Some historians argue X, others argue Y' is L2 ceiling. L4 requires you to evaluate WHY they disagree (different sources / different timeframes / different ideological priors). L5 needs your own judgement on which interpretation the evidence supports BETTER, with a reason. The other killer: not addressing the precise wording — 'to what extent' is not the same prompt as 'how far do you agree' and you'll be penalised for treating them identically. Atom-stub-348 has the prompt-type → rubric-band table."
